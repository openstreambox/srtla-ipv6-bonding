srt {
    worker_threads 1;
    worker_connections 300;
    http_port 8181;                    # stats API: http://<host>:8181/stats
    log_file logs/srt_server.log;
    log_level info;
    pidfile /tmp/sls/sls.pid;
    server {
        listen_player 4000;            # republished SRT here: srt://<host>:4000?streamid=play/live/bond
        listen_publisher 4001;         # direct (non-bonded) SRT fallback
        listen_publisher_srtla 4002;   # CAR srtla_send connects here (SRTLA, IPv6 dual-stack auto-bind)
        latency_min 200;
        latency_max 5000;
        domain_player play;
        domain_publisher publish;
        default_sid publish/live/bond;
        backlog 100;                   # REQUIRED (without it srt_listen fails with "Bad parameters")
        idle_streams_timeout -1;
        app {
            app_player live;
            app_publisher live;
            allow publish all;
            allow play all;
        }
    }
}
